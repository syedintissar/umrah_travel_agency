# Local development services. Production uses AWS RDS + ElastiCache.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: umrah
      POSTGRES_PASSWORD: umrah_dev_password
      POSTGRES_DB: umrah_travel
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umrah -d umrah_travel']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
